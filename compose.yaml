services:
  app:
    image: ${LIFETIME_IMAGE:-lifetime:local}
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_URL: ${SERVICE_URL:-http://127.0.0.1:8057}
      ANALYTICS_SECRET: ${ANALYTICS_SECRET:-}
      LIFETIME_DATA_DIR: /var/lib/lifetime
    ports:
      - "127.0.0.1:8057:8000"
    volumes:
      - lifetime-data:/var/lib/lifetime
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s

volumes:
  lifetime-data:
