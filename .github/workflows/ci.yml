name: LifeTime checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check tracked private files and historical logs
        run: python3 scripts/check_repository_safety.py
      - name: Scan Git history for secrets
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact=100 --no-banner

  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: lifetime-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: lifetime_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      TEST_MYSQL_URL: mysql+pymysql://root:lifetime-ci-only@127.0.0.1:3306/lifetime_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Install resolved dependencies
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt
      - name: Check environment and code
        run: |
          python -m pip check
          python -m ruff check lifetime migrations scripts tests
          python -m ruff format --check lifetime migrations scripts tests
          python -m pytest
      - name: Audit runtime and development dependency locks
        run: |
          python -m pip_audit -r requirements-lock.txt --disable-pip
          python -m pip_audit -r requirements-dev-lock.txt --disable-pip
      - name: Build distributable
        run: python -m build --no-isolation
      - name: Verify release metadata
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import os
          release = Path('VERSION').read_text().strip()
          assert version('lifetime-service') == release
          ref = os.environ.get('GITHUB_REF', '')
          if ref.startswith('refs/tags/v'):
              assert ref.removeprefix('refs/tags/v') == release
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifetime-distribution
          path: dist/

  container:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: lifetime-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose and build
        run: |
          docker compose -f compose.yaml -f compose.mysql.yaml config --quiet
          docker compose -f compose.yaml -f compose.mysql.yaml build
      - name: Initialize fresh volume and start
        run: |
          docker compose -f compose.yaml -f compose.mysql.yaml up -d mysql --wait --wait-timeout 180
          docker compose -f compose.yaml -f compose.mysql.yaml run --rm app flask --app lifetime migrate
          docker compose -f compose.yaml -f compose.mysql.yaml run --rm app flask --app lifetime import-data
          docker compose -f compose.yaml -f compose.mysql.yaml up -d --wait --wait-timeout 60
          curl --fail http://127.0.0.1:8057/readyz
          curl --fail http://127.0.0.1:8057/uk
          curl --fail http://127.0.0.1:8057/sitemap.xml
      - name: Stop isolated CI containers
        if: always()
        run: docker compose -f compose.yaml -f compose.mysql.yaml down --volumes
