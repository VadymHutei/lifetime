[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifetime-service"
dynamic = ["version"]
description = "Life expectancy statistics, thoughtfully presented in Ukrainian and English"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "Flask==3.1.3",
  "SQLAlchemy==2.1.2",
  "alembic==1.20.0",
  "gunicorn==26.2.0",
  "PyMySQL[rsa]==1.2.3",
  "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pip-audit==2.10.1", "build", "pip-tools"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["lifetime*", "migrations*"]

[tool.setuptools.package-data]
lifetime = ["templates/*.html", "templates/**/*.html", "static/*", "static/**/*", "services/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
