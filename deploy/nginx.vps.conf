# Loaded inside http{}; safe edge logs intentionally omit IP/query/Referer/body.
map $uri $lifetime_path {
    default "/[redacted]";
    ~^/(uk|en|ukr|eng|rus)(/(countries|regions|sources|methodology|privacy|about|result))?/?$ $uri;
    ~^/(robots\.txt|sitemap\.xml|healthz|readyz)$ $uri;
    ~^/static/(style\.css|app\.js|favicon\.svg)$ $uri;
}
map $http_user_agent $lifetime_agent {
    default "other";
    ~*(googlebot|bingbot|duckduckbot|spider|crawler|bot) "crawler:bot";
    ~*(firefox|chrome|safari|edg/) "browser:chrome";
}
log_format lifetime_safe escape=json
    '{"timestamp":"$time_iso8601","edge_request_id":"$request_id",'
    '"method":"$request_method","path":"$lifetime_path",'
    '"user_agent":"$lifetime_agent","status":$status,'
    '"duration_seconds":$request_time,"response_bytes":$bytes_sent}';
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null crit;
    location = /proxy-health { return 200 "ok\n"; }
    location / { return 444; }
}
server {
    listen 80;
    server_name lifetime.ukubuka.net;
    access_log /var/log/lifetime/edge.jsonl lifetime_safe;
    error_log /dev/null crit;
    client_max_body_size 16k;
    location /.well-known/acme-challenge/ { root /var/www/acme; access_log off; }
    location / { return 301 https://lifetime.ukubuka.net$request_uri; }
}
# HTTPS is enabled by deploy/vps-admin.sh after successful certificate issuance.
