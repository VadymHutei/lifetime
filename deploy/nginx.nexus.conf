# Copy into the infrastructure repository's proxy/conf.d/lifetime.conf.
# Included in nginx's http context; TLS must cover lifetime.ukubuka.net.
map $uri $lifetime_analytics_path {
    default "/[redacted]";
    ~^/(uk|en|ukr|eng|rus)(/(countries|regions|sources|methodology|privacy|about|result))?/?$ $uri;
    ~^/(robots\.txt|sitemap\.xml|health|healthz|ready|readyz)$ $uri;
    ~^/static/(style\.css|app\.js|favicon\.svg)$ $uri;
}
map $http_user_agent $lifetime_analytics_agent {
    default "other";
    ~*(googlebot|bingbot|duckduckbot|yandexbot|spider|crawler|bot) "crawler:bot";
    ~*(firefox|chrome|safari|edg/) "browser:chrome";
}
log_format lifetime_safe escape=json
    '{"timestamp":"$time_iso8601","edge_request_id":"$request_id",'
    '"method":"$request_method","path":"$lifetime_analytics_path",'
    '"user_agent":"$lifetime_analytics_agent","status":$status,'
    '"duration_seconds":$request_time,"response_bytes":$bytes_sent}';

server {
    listen 80;
    listen [::]:80;
    server_name lifetime.ukubuka.net;
    access_log /var/log/nginx/lifetime/edge.jsonl lifetime_safe;
    error_log /dev/null crit;
    return 301 https://lifetime.ukubuka.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lifetime.ukubuka.net;
    ssl_certificate /etc/letsencrypt/live/ukubuka.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ukubuka.net/privkey.pem;
    client_max_body_size 16k;
    access_log /var/log/nginx/lifetime/edge.jsonl lifetime_safe;
    error_log /dev/null crit;

    # Resolve again after an application container changes its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $lifetime_backend lifetime:8000;

    location / {
        proxy_pass http://$lifetime_backend;
        proxy_http_version 1.1;
        proxy_set_header Host lifetime.ukubuka.net;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
