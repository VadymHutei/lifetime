# Optional edge: app port is private. All public/static HTTP passes through WSGI.
# No raw query, request, body, referrer, IP or User-Agent is ever access-logged.
# Nginx cannot compute the application's HMAC. Edge-only events have no IP token.
# Protect/rotate /var/log/lifetime; ingest JSONL then delete per retention policy.
map $uri $analytics_path {
    default "/[redacted]";
    ~^/(uk|en|ukr|eng|rus)(/(countries|regions|sources|methodology|privacy|about|result))?/?$ $uri;
    ~^/(robots\.txt|sitemap\.xml|health|healthz|ready|readyz)$ $uri;
    ~^/static/(style\.css|app\.js|favicon\.svg)$ $uri;
}
map $http_user_agent $analytics_agent {
    default "other";
    ~*(googlebot|bingbot|duckduckbot|yandexbot|spider|crawler|bot) "crawler:bot";
    ~*(firefox|chrome|safari|edg/) "browser:chrome";
}
log_format lifetime_safe escape=json
    '{"timestamp":"$time_iso8601","edge_request_id":"$request_id",'
    '"method":"$request_method","path":"$analytics_path",'
    '"user_agent":"$analytics_agent","status":$status,'
    '"duration_seconds":$request_time,"response_bytes":$bytes_sent}';
server {
    listen 80;
    server_name _;
    client_max_body_size 16k;
    access_log /var/log/lifetime/edge.jsonl lifetime_safe;
    # Default nginx error logs can contain raw request URLs. Keep them off;
    # use sanitized access outcome/status plus container/process diagnostics.
    error_log /dev/null crit;
    location / {
        proxy_pass http://app:8000;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
