server {
    listen 443 ssl default_server;
    server_name lifetime.ukubuka.net;
    ssl_certificate /etc/letsencrypt/live/lifetime.ukubuka.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifetime.ukubuka.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    access_log /var/log/lifetime/edge.jsonl lifetime_safe;
    error_log /dev/null crit;
    add_header X-Request-ID $request_id always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend app:8000;
    if ($host != lifetime.ukubuka.net) { return 444; }
    location / {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host lifetime.ukubuka.net;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}
